faq:
  - question: We are on a well in North Stamford. Does that change what fails?
    answer: >-
      Considerably. Well water in this part of Fairfield County tends to carry hardness and
      iron, and both go straight to the narrowest openings in an appliance: ice maker fill
      valves, dishwasher spray jets and washer inlet screens. Repairs hold far longer when
      the water treatment is corrected at the same time, and a technician will tell you
      what they are seeing.

  - question: My garage freezer stopped working in January. What happened?
    answer: >-
      Most likely nothing broke. A standard freezer is designed to sit in a room above
      about fifty-five degrees, and an unheated Stamford garage drops well below that. The
      thermostat reads the cold air around it and stops running, so the contents thaw even
      though the machine is fine. The fix is a garage-ready kit where the manufacturer
      offers one, or moving the unit indoors.

  - question: Do you service buildings in Harbor Point and downtown?
    answer: >-
      Yes. Those buildings usually restrict service elevator hours and want the front desk
      notified in advance, so tell us the building when you call and we will book into a
      window that works rather than sending someone who cannot get upstairs.

  - question: How quickly can someone get to me?
    answer: >-
      We schedule the nearest available technician and give you an estimated arrival window
      on the call. Crossing between the shoreline and the north end of town takes real time,
      particularly at commuter hours, and the window we give you reflects that rather than
      pretending otherwise.
