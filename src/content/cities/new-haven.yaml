faq:
  - question: My breaker trips when the dryer and the oven run together. Is the appliance faulty?
    answer: >-
      Usually not. A great many New Haven houses still have sixty to one hundred amp
      service from an era with far lighter demand, and two heavy loads at once is simply
      more than the panel can carry. A technician can confirm the appliance is drawing what
      it should, but the answer in that case is an electrician, and we will tell you so
      rather than sell you a part.

  - question: Our three-family shares a basement laundry. Will you work on it?
    answer: >-
      Yes, and in Fair Haven, Edgewood and the streets around East Rock it is a large share
      of what we do. The thing worth knowing is that the shared vent run is almost always
      the underlying cause when a dryer stops drying properly, so we check and clear it as
      part of the visit rather than replacing a fuse that will fail again in a month.

  - question: My refrigerator will not fit back through the doorway. What now?
    answer: >-
      It happens often in older housing with narrow turns on the stairs. Some repairs can be
      done in place with the unit pulled forward; others genuinely cannot. A technician
      assesses that first and tells you which situation you are in before any work or any
      charge is agreed.

  - question: How fast can you get someone out?
    answer: >-
      We schedule the nearest available technician and give you an estimated arrival window
      while you are still on the phone. You will know who is coming and roughly when, rather
      than being told to wait somewhere between morning and evening.
