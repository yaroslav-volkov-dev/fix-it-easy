metaTitle: Appliance Repair in New Haven, CT | FIX IT EASY
metaDescription: >-
  Same-day appliance repair in New Haven, from East Rock to Morris Cove. Old panels, shared
  basement laundry, tight stairs. Call to check availability.

heroIntro: >-
  A great deal of New Haven's housing went up before anyone imagined a household running a
  dishwasher, an induction range and a second refrigerator at the same time. Three-family
  houses from the turn of the last century still carry sixty to one hundred amp service.
  Laundry still lives in a shared basement at the end of a duct run that was added decades
  after the house was built. Staircases were never sized for a modern French-door
  refrigerator, and neither were the doorways at the top of them. The result is a set of
  problems that have very little to do with the appliance being poorly made, and a great
  deal to do with the building it was installed into.

localConditions:
  - title: Sixty to one hundred amp panels in older houses
    body: >-
      A century-old multi-family with its original service simply does not have the
      capacity a modern kitchen expects. Breakers that trip whenever the dryer and the oven
      overlap are not an appliance fault, and replacing a heating element will not change
      it. We identify that plainly rather than charging for a repair that cannot solve it.

  - title: Shared basement laundry at the end of long duct runs
    body: >-
      In a three-family, the laundry usually sits in the basement with a vent run that
      travels a long way before it reaches daylight, often shared awkwardly between units
      and rarely cleaned. That run is the reason dryers here take two cycles, and it is
      also the reason thermal fuses keep blowing after being replaced.

  - title: Narrow stairs and doorways limit what can come out
    body: >-
      Victorian and early-twentieth-century houses were built with turns on the staircase
      and doorways under thirty inches. Removing a wide refrigerator for a rear-panel repair
      is sometimes not possible at all, which changes how a repair has to be approached. We
      look at that before quoting so the plan is realistic.

  - title: Cold basements and porches in winter
    body: >-
      Second freezers stored on an unheated back porch or in an uninsulated basement corner
      drift out of their operating range once the temperature outside stays below freezing.
      The unit stops cycling because it reads the cold room, not the warm contents, and
      everything inside slowly thaws.

