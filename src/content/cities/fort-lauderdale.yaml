faq:
  - question: Why do appliances near the Intracoastal fail sooner?
    answer: >-
      Airborne salt reaches every exposed metal surface, and condenser coils are the most
      vulnerable because air is being pulled across them continuously. Once corrosion
      insulates a coil, the compressor works harder and runs hotter, which shortens its life
      well before anything looks broken. Homes in Harbor Beach, Las Olas Isles and Rio Vista
      see this years earlier than houses a few miles inland.

  - question: My condo requires a certificate of insurance. Can you provide one?
    answer: >-
      Tell us the building when you call and we will handle the paperwork the management
      office needs before the visit. Most towers in Fort Lauderdale ask for it, and sorting
      it out in advance is the difference between a technician getting upstairs and being
      turned away at the loading dock.

  - question: Can you service a stacked washer and dryer in a closet?
    answer: >-
      Yes. Closet installations take longer because the pair usually has to be unstacked to
      reach the vent connection and the blower, and there is rarely room to work from the
      side. That time is in the fixed price you approve before anything starts.

  - question: Do you work on built-in and integrated kitchen appliances?
    answer: >-
      Yes, including panel-fronted refrigerators and integrated dishwashers. Those units
      have to come out of the cabinetry for most repairs, so we allow for it in the quote
      rather than discovering it halfway through and asking for more.
