faq:
  - question: My refrigerator failed right after a Tampa thunderstorm. Is that a coincidence?
    answer: >-
      Almost certainly not. This region takes more lightning than anywhere else in the
      country, and a nearby strike puts a surge on the line that damages the control board
      without leaving any visible mark. If the failure landed within a few days of a storm,
      tell the technician when you call — it changes where the diagnosis starts.

  - question: Does Tampa water really affect my dishwasher and ice maker?
    answer: >-
      Yes. Water hardness across much of Hillsborough County deposits scale in the smallest
      openings first, so spray jets narrow and fill valves restrict long before anything
      breaks. If your dishwasher stopped cleaning well without any error code, scale is the
      first thing worth ruling out.

  - question: How soon can a technician reach my part of Tampa?
    answer: >-
      We schedule the nearest available technician and give you an estimated arrival window
      on the call rather than a vague half-day promise. Travel across the bay and over the
      bridges at rush hour is real, so the window we give you accounts for it honestly.

  - question: Do you charge more for a high-rise or a built-in appliance?
    answer: >-
      The price depends on the work, not on the address. Built-in and high-rise jobs
      genuinely take longer because the unit has to come out of its cabinet and the building
      may restrict elevator access, and that time is included in the fixed price you approve
      before we start. It does not change once work is under way.
